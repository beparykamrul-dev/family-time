# ISP-OS Main Admin Nginx Configuration
# Features: Origin-pull, Heavy caching, Compression, Load balancing

# Cache zones
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m max_size=50g inactive=365d use_temp_path=off;
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:50m max_size=20g inactive=1h use_temp_path=off;
proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports_cache:20m max_size=10g inactive=24h use_temp_path=off;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=1000r/s;

# Upstream backends with health checks
upstream admin_backend {
    least_conn;
    server admin-api:8000 max_fails=3 fail_timeout=10s;
    server aws-proxy:8000 max_fails=3 fail_timeout=10s backup;
    server gcp-proxy:8000 max_fails=3 fail_timeout=10s backup;
    keepalive 64;
}

# Upstream for static content origin
upstream static_origin {
    server bunny-cdn-origin.local:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name admin.isp-os.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.isp-os.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/admin.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.key;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml;
    
    brotli on;
    brotli_comp_level 6;

    # ============ FRONTEND (React Admin Dashboard) ============
    location / {
        proxy_pass http://admin_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        
        # Cache headers
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Cache-Status $upstream_cache_status always;
        
        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ API ENDPOINTS ============
    
    # Real-time APIs (NO CACHE)
    location ~ ^/api/v1/realtime/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://admin_backend;
        proxy_cache off;
        proxy_no_cache 1;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # User/Auth APIs (5 min cache, invalidate on change)
    location ~ ^/api/v1/(auth|users|permissions)/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://admin_backend;
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$request_method$host$request_uri$cookie_sessionid";
        proxy_cache_methods GET HEAD;
        
        # Don't cache POST/PUT/DELETE
        proxy_cache_bypass $request_method;
        proxy_no_cache $request_method;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "max-age=300" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Analytics APIs (30 min cache)
    location ~ ^/api/v1/analytics/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://admin_backend;
        proxy_cache api_cache;
        proxy_cache_valid 200 30m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "max-age=1800, public" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard/Metrics APIs (10 min cache)
    location ~ ^/api/v1/(dashboard|metrics|system)/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://admin_backend;
        proxy_cache api_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "max-age=600, public" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Generic API (5 min cache)
    location ~ ^/api/v1/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://admin_backend;
        proxy_cache api_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $request_method;
        proxy_no_cache $request_method;
        
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "max-age=300, public" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============ STATIC ASSETS (Forever cache) ============
    location ~ \.(js|css|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        proxy_pass http://admin_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 365d;
        proxy_cache_key "$scheme$host$request_uri";
        
        expires 365d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ============ REPORTS & EXPORTS ============
    location ~ ^/api/v1/reports/ {
        limit_req zone=admin_limit burst=20 nodelay;
        proxy_pass http://admin_backend;
        proxy_cache reports_cache;
        proxy_cache_valid 200 24h;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        
        add_header Cache-Control "max-age=86400, public" always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============ HEALTH CHECK ============
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============ CACHE STATUS ============
    location /cache-stats {
        access_log off;
        proxy_pass http://127.0.0.1:9113;
    }

    # ============ MONITORING/METRICS ============
    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
    }
}

# HTTP/2 Server Push for critical assets
server {
    listen 443 ssl http2;
    server_name push.admin.isp-os.com;
    
    ssl_certificate /etc/nginx/ssl/admin.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.key;
    
    location / {
        # Push critical JS/CSS bundles
        http2_push /static/admin.bundle.js;
        http2_push /static/admin.bundle.css;
        
        proxy_pass http://admin_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 1h;
    }
}
