# Keepalived Configuration for HA Admin Gateway
# VRRP Virtual Router Redundancy Protocol

global_defs {
  router_id ADMIN_HA_ROUTER
  script_user root root
  enable_script_security
  notification_email_from admin@isp-os.com
  smtp_server localhost
  smtp_connect_timeout 30
}

# VRRP Instance for Admin Gateway
vrrp_script check_admin_api {
  script "/usr/local/bin/check_admin_api.sh"
  interval 5
  weight -20
  fall 3
  rise 2
}

vrrp_instance ADMIN_VIP {
  state MASTER
  interface eth0
  virtual_router_id 101
  priority 255
  advert_int 1
  authentication {
    auth_type PASS
    auth_pass admin_secure_pass_2024
  }

  virtual_ipaddress {
    10.0.0.10/24 dev eth0
  }

  track_script {
    check_admin_api
  }

  notify_master "/usr/local/bin/notify_master.sh"
  notify_backup "/usr/local/bin/notify_backup.sh"
  notify_fault "/usr/local/bin/notify_fault.sh"

  # Strict mode for failover
  dont_track_primary
  garp_master_repeat 5
  garp_master_refresh 10
}
